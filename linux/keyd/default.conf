# Mac-style layout for a 68% board: [Ctrl] [Opt/Alt] [Cmd/Super] [Space]
# Mirrors kingsotn/dotfiles karabiner.json + skhdrc.

[ids]
*

[main]
# Caps = Hyper (hold only). Unmapped keys come out as Super+key, which i3 binds.
capslock = layer(hyper)
# NIZ Plum 68 factory layout is Ctrl | Win | Alt; keycaps are Mac order Ctrl | Opt | Cmd.
# Cmd (3rd key, sends leftalt): acts as Ctrl for shortcuts (Cmd+C/V/T/W...).
# Terminal overrides in ~/.config/keyd/app.conf
leftalt = layer(cmd)
# Opt (2nd key, sends leftmeta): acts as Alt, plus macOS text-navigation habits
leftmeta = layer(opt)

[hyper:M]
# Hyper + i/j/k/l = arrows (hold shift to select)
i = up
j = left
k = down
l = right
# Hyper + 9/0 = word jump
9 = C-left
0 = C-right
# "Hyper Terminal" rules
c = C-c
v = C-v
z = C-z
r = C-r
x = C-r
b = C-b
space = C-space

[cmd:C]
# macOS line/document navigation
left = home
right = end
up = C-home
down = C-end
# Cmd+Q quits the app, Cmd+Space opens the launcher (i3 Super+d)
q = A-f4
space = M-d
# Cmd+1..9 = go to tab N (Linux apps use Alt+N: Firefox, Chrome, gnome-terminal, Cursor)
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

[opt:A]
# macOS word navigation / deletion
left = C-left
right = C-right
backspace = C-backspace

[shift]
# 68% board: Shift+Esc = ~
esc = S-grave

# Hyper+Cmd / Hyper+Opt + j/l/i/k: line / word / document jumps, like Cmd/Opt+arrows on Mac
[hyper+cmd]
j = home
l = end
i = C-home
k = C-end

[hyper+opt]
j = C-left
l = C-right

# Cmd+Opt+arrows (iTerm pane navigation; kitty binds ctrl+alt+arrows)
[cmd+opt]
left = C-A-left
right = C-A-right
up = C-A-up
down = C-A-down
