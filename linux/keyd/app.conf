# Per-app overrides, applied by keyd-application-mapper (started from i3).
# Terminals: Cmd+C/V/etc must be Ctrl+Shift so plain Ctrl+C still interrupts.

[gnome-terminal]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.t = C-S-t
cmd.w = C-S-w
cmd.n = C-S-n
cmd.f = C-S-f
cmd.a = C-S-a

# kitty: Cmd+<key> -> ctrl+alt+<key>; ~/.config/kitty/kitty.conf binds iTerm2 actions
[kitty]
cmd.c = C-A-c
cmd.v = C-A-v
cmd.d = C-A-d
cmd.w = C-A-w
cmd.t = C-A-t
cmd.n = C-A-n
cmd.k = C-A-k
cmd.q = C-A-q
cmd.enter = C-A-enter
cmd.leftbrace = C-A-leftbrace
cmd.rightbrace = C-A-rightbrace
cmd.equal = C-A-equal
cmd.minus = C-A-minus
cmd.0 = C-A-0
