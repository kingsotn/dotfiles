# btop for a shared box: CPU + GPU + RAM + who is using it. Unlisted options use btop defaults.
color_theme = "Default"
theme_background = False
update_ms = 1000

# Boxes: no network / disks
shown_boxes = "cpu mem proc gpu0"

# CPU: one combined graph, temperature on
cpu_single_graph = True
check_temp = True
show_coretemp = True
show_uptime = True

# GPU: shown in its own box (gpu0), not duplicated in the CPU box
show_gpu_info = "Off"
nvml_measure_pcie_speeds = False

# Memory: available/used + swap, no disk list
show_disks = False
show_swap = True
mem_graphs = True

# Processes: heaviest first, show user, memory in bytes
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_mem_bytes = True
proc_per_core = False
proc_filter_kernel = True
