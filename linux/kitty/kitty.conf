# iTerm2-style keys. keyd sends Cmd+<key> as ctrl+alt+<key> inside kitty
# (~/.config/keyd/app.conf), so these never collide with shell Ctrl keys or i3.

font_size        12.0
enabled_layouts  splits,stack
enable_audio_bell no
tab_bar_edge     top
tab_bar_style    powerline
confirm_os_window_close 0
# Block cursor; stop shell integration switching it to a beam at the prompt
cursor_shape          block
cursor_blink_interval 0
shell_integration     enabled no-cursor
# Lets `kitty @ ...` from local scripts control kitty (used for testing shortcuts)
allow_remote_control  socket-only
listen_on             unix:@kitty-{kitty_pid}
clear_all_shortcuts yes

# Clipboard
map ctrl+alt+c copy_to_clipboard
map ctrl+alt+v paste_from_clipboard

# Panes: Cmd+D split right, Cmd+Shift+D split down, Cmd+W close
map ctrl+alt+d       launch --location=vsplit --cwd=current
map ctrl+alt+shift+d launch --location=hsplit --cwd=current
map ctrl+alt+w       close_window
# Cmd+[ / Cmd+] previous / next pane, Cmd+Opt+arrows move between panes
map ctrl+alt+[     previous_window
map ctrl+alt+]     next_window
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
# Cmd+Shift+Enter maximize pane (toggle)
map ctrl+alt+shift+enter toggle_layout stack

# Tabs: Cmd+T new, Cmd+Shift+[ / ] prev/next, Cmd+1..9 (keyd sends alt+N)
map ctrl+alt+t       new_tab_with_cwd
map ctrl+alt+shift+[ previous_tab
map ctrl+alt+shift+] next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 99

# Settings: Cmd+, edit this file, Cmd+Shift+, reload it (like kitty on macOS)
map ctrl+alt+comma       edit_config_file
map ctrl+alt+shift+comma load_config_file

# Windows / misc: Cmd+N new window, Cmd+K clear, Cmd+Q quit, Cmd+Enter fullscreen, Cmd+ +/- font
map ctrl+alt+n     new_os_window_with_cwd
map ctrl+alt+k     clear_terminal to_cursor active
map ctrl+alt+q     quit
map ctrl+alt+enter toggle_fullscreen
map ctrl+alt+equal       change_font_size all +1.0
map ctrl+alt+plus        change_font_size all +1.0
map ctrl+alt+shift+equal change_font_size all +1.0
map ctrl+alt+minus change_font_size all -1.0
map ctrl+alt+0     change_font_size all 0
